<!DOCTYPE html>
<html>
    <head>
        <title>Kedamawi</title>
        <style>
            .feedback{
                display:grid;
            }
        </style>
    </head>
    <body>
        <form method="POST" action="{{ url_for('feedback') }}" class="feedback">
             <h3>Feedback</h3>
             <textarea name="comment" style="text-align:left;align-items:center;padding-left: 20px;" rows="25" cols="90" placeholder="Enter your feedback here..." ></textarea>
             <button id="ended" type="submit" style="width:65px;height:25px;border-radius:20px;background-color: rgb(230, 227, 237);">Submit</button>
        </form>
        <div class="ter">
            <div class="star-rating">
                <span data-value="1">&#9733;</span>
                <span data-value="2">&#9733;</span>
                <span data-value="3">&#9733;</span>
                <span data-value="4">&#9733;</span>
                <span data-value="5">&#9733;</span>
            </div>

            <p id="rating-value">Rating: 0</p>
        </div>
        <script src="{{ url_for('static', filename='js/feedback.js') }}">
            document.addEventListener("DOMContentLoaded", function() {
             // Store the active rating globally within our listener scope
                 let currentRating = 0; 

                 // 1. STAR RATING SYSTEM
                 const stars = document.querySelectorAll('.star-rating span');
                 const ratingText = document.getElementById('rating-value');

                 stars.forEach(star => {
                     star.addEventListener('click', () => {
                         // Multiply by 2 matching your 10-point scale logic
                         currentRating = parseInt(star.getAttribute('data-value')) * 2; 
                         ratingText.textContent = `Rating of: ${currentRating}/10`;
                         updateStars(star.getAttribute('data-value'));
                     });
                 });

                 function updateStars(ratingValue) {
                     stars.forEach(star => {
                         star.classList.remove('filled');
                         if (parseInt(star.getAttribute('data-value')) <= ratingValue) {
                             star.classList.add('filled');
                         }
                     });
                 }
            });

        </script>
    </body>
</html>
